<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>育つ家系図 | 試作品 改良版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#27352f;background:#f6f7ef}*{box-sizing:border-box}body{margin:0}main{max-width:940px;margin:auto;padding:26px 16px 70px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#667c69;font-weight:700}.title{font-size:clamp(28px,6vw,42px);margin:8px 0 5px;letter-spacing:.06em}.sub{color:#64756a;font-size:13px;line-height:1.7;margin:0}.pill{white-space:nowrap;border:1px solid #a3b9a6;border-radius:50px;padding:7px 10px;font-size:11px;color:#42614a}.panel{background:#fff;border:1px solid #e0e7db;border-radius:22px;box-shadow:0 9px 26px #36543c0a;padding:20px;margin-top:18px}.label{font-size:13px;font-weight:700;color:#526858}.controls{display:flex;align-items:center;justify-content:center;gap:17px;margin:13px 0 14px}.step{width:57px;height:57px;border-radius:18px;border:1px solid #cbd9cd;background:#f1f7ee;color:#28583d;font-size:27px;cursor:pointer;touch-action:manipulation}.step.next{background:#286846;color:white;border-color:#286846}.step:disabled{opacity:.35;cursor:default}.count{min-width:125px;text-align:center}.number{font-size:43px;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}.unit{font-size:12px;color:#7a887d}.range{width:100%;accent-color:#327a52;cursor:pointer}.ends{display:flex;justify-content:space-between;color:#8a998d;font-size:11px}.stagehead{display:flex;align-items:center;justify-content:space-between;gap:8px}.stagehead h2{font-size:18px;margin:0}.stagehint{font-size:11px;color:#829084}.stage{margin-top:14px;overflow:hidden;border-radius:16px;background:radial-gradient(circle at 50% 15%,#f7faf1,#eef5ed);min-height:340px;padding:14px 4px}.tree{position:relative;width:760px;height:335px;margin:0;transform-origin:top left}.tree-wrap{width:100%;position:relative;overflow:hidden}.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.branch{fill:none;stroke:#91ac91;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:opacity .35s}.person{position:absolute;width:152px;min-height:66px;border:1px solid #d2dfd1;border-radius:13px;background:#fff;box-shadow:0 4px 12px #34553a12;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:9px 7px;text-align:center;cursor:pointer;transition:opacity .3s,transform .35s,border-color .2s;transform:translateY(0)}.person.hidden{opacity:0;transform:translateY(-14px);pointer-events:none}.person:focus-visible{outline:3px solid #79bd89}.person.selected{border-color:#257d4c;box-shadow:0 0 0 2px #257d4c30}.person strong{font-size:13px}.person small{font-size:10px;color:#738475}.tag{display:inline-block;background:#e7f4e6;color:#467452;border-radius:20px;padding:4px 8px;font-size:11px}.note{font-size:13px;line-height:1.8;color:#4c5e50;margin:9px 0 0}.details{background:#f4f8f0;border:1px solid #dce8d9;border-radius:14px;padding:15px;margin-top:16px;min-height:100px}.details h3{margin:0 0 6px;font-size:16px}.details p{margin:0;font-size:13px;line-height:1.75}.details .tiny{font-size:11px;color:#6c826f;margin-bottom:7px}.footer{font-size:12px;line-height:1.8;color:#718176;margin-top:18px}.jump{margin-top:8px;border:1px solid #cbd9cd;border-radius:12px;padding:10px 14px;background:#eef7ed;color:#275c3b;font-weight:700;width:100%;cursor:pointer}.reset{border:0;background:transparent;text-decoration:underline;color:#587b60;font-size:12px;cursor:pointer}.status{font-size:12px;color:#356f49;min-height:19px;margin-top:9px;font-weight:600}@media(max-width:600px){main{padding-top:22px}.panel{padding:16px}.stage{margin-left:-7px;margin-right:-7px}.top{align-items:center}.pill{font-size:10px}.tree{margin-left:0}.stagehint{max-width:150px;text-align:right}}
</style></head><body><main><header class="top"><div><div class="eyebrow">READING COMPANION · PROTOTYPE</div><h1 class="title">育つ家系図 <span aria-hidden="true">🌱</span></h1><p class="sub">読んだページまでの人物と関係だけが、少しずつ枝を伸ばす。</p></div><div class="pill">架空の物語で試作中</div></header>
<section class="panel" aria-label="読書位置"><div class="label">現在の読書位置</div><div class="controls"><button class="step" id="prev" aria-label="1ページ戻る">−</button><div class="count"><div class="number" id="pageNumber">1</div><div class="unit">ページ / 200</div></div><button class="step next" id="next" aria-label="1ページ進む">＋</button></div><input class="range" type="range" id="pageSlider" min="1" max="200" value="1" step="1" aria-label="ページ数"><div class="ends"><span>1ページ</span><span>200ページ</span></div><div class="status" id="status" aria-live="polite"></div><button class="jump" id="jump">次の変化へ →</button></section>
<section class="panel"><div class="stagehead"><h2>人物のつながり</h2><div class="stagehint">人物をタップすると紹介を表示</div></div><div class="stage" aria-label="家系図"><div class="tree-wrap" id="treeWrap"><div class="tree" id="tree"><svg class="lines" viewBox="0 0 760 335" aria-hidden="true"><path id="edge-ab" class="branch" d="M300 66 H460"/><path id="edge-c" class="branch" d="M380 66 V112 H140 V135"/><path id="edge-d" class="branch" d="M380 112 V135"/><path id="edge-e" class="branch" d="M380 112 H620 V135"/><path id="edge-f" class="branch" d="M380 201 V245 H255 V267"/><path id="edge-g" class="branch" d="M380 245 H505 V267"/></svg></div></div></div><div class="details" id="details" aria-live="polite"><h3>人物を選んでください</h3><p>ページを進めると新しい人物が現れます。</p></div></section>
<p class="footer">※これは操作確認用の試作品です。登場人物・ページ数・関係はすべて架空のものです。『百年の孤独』の実際の展開やページ数は含まれていません。読書位置はこの端末のブラウザに保存されます。 <button class="reset" id="reset">最初からやり直す</button></p></main>
<script>
const MAX=200;const people=[
{id:'a',name:'春野 宗一',role:'第一世代',at:1,x:224,y:0,description:'町のはずれに家を建てた人物。物語の最初に登場する。'},
{id:'b',name:'春野 澄',role:'第一世代',at:12,x:384,y:0,description:'宗一の伴侶。12ページで名前が明らかになる。'},
{id:'c',name:'春野 灯',role:'第二世代',at:30,x:64,y:135,description:'宗一と澄の子。遠くの港町に憧れている。'},
{id:'d',name:'春野 航',role:'第二世代',at:55,x:304,y:135,description:'灯の弟。町の古い地図を集めている。'},
{id:'e',name:'春野 凪',role:'第二世代',at:90,x:544,y:135,description:'新たに登場する家族。幼い頃の出来事が少しずつ語られる。'},
{id:'f',name:'春野 紬',role:'第三世代',at:125,x:179,y:267,description:'航の子。家族に残された手紙を見つける。'},
{id:'g',name:'春野 透',role:'第三世代',at:170,x:429,y:267,description:'航の子。物語の後半に姿を現す。'}];
const edges=[['edge-ab',20],['edge-c',45],['edge-d',70],['edge-e',110],['edge-f',145],['edge-g',190]];
const slider=document.getElementById('pageSlider'),number=document.getElementById('pageNumber'),status=document.getElementById('status'),details=document.getElementById('details'),tree=document.getElementById('tree'),treeWrap=document.getElementById('treeWrap');let saved=1;try{saved=Number(localStorage.getItem('growing-tree-page')||1)}catch(e){}let page=saved;if(!Number.isFinite(page))page=1;page=Math.max(1,Math.min(MAX,page));let selected=null;
people.forEach(p=>{let el=document.createElement('button');el.type='button';el.className='person hidden';el.style.left=p.x+'px';el.style.top=p.y+'px';el.id='person-'+p.id;el.innerHTML='<strong>'+p.name+'</strong><small>'+p.role+'</small>';el.onclick=()=>{selected=p.id;render()};tree.append(el)});
function render(){slider.value=page;number.textContent=page;document.getElementById('prev').disabled=page===1;document.getElementById('next').disabled=page===MAX;try{localStorage.setItem('growing-tree-page',page)}catch(e){};let unlocked=people.filter(p=>page>=p.at);for(const p of people){let el=document.getElementById('person-'+p.id);el.classList.toggle('hidden',page<p.at);el.classList.toggle('selected',selected===p.id&&page>=p.at);el.tabIndex=page>=p.at?0:-1;el.setAttribute('aria-hidden',page<p.at?'true':'false')}for(const [id,at] of edges){document.getElementById(id).style.opacity=page>=at?'1':'0'}if(selected&&!unlocked.some(p=>p.id===selected))selected=null;let chosen=people.find(p=>p.id===selected);if(chosen){details.innerHTML='<div class="tiny">'+chosen.role+' · '+chosen.at+'ページから登場</div><h3>'+chosen.name+'</h3><p>'+chosen.description+'</p>'}else{details.innerHTML='<h3>人物を選んでください</h3><p>現在表示されている '+unlocked.length+' 人から選べます。人物間の線も、関係が明らかになったページで現れます。</p>'}let recent=[...people.map(p=>({at:p.at,name:p.name+' が登場'})),...edges.map(([id,at])=>({at,name:'新しい関係が判明'}))].filter(e=>e.at===page);const upcoming=milestones.find(n=>n>page);status.textContent=recent.length?'🌿 '+recent.map(e=>e.name).join('・'):(upcoming?'次の変化は '+upcoming+' ページ':'すべての人物が登場しました');document.getElementById('jump').textContent=upcoming?'次の変化へ（'+upcoming+'ページ） →':'最初に戻る ↺'}
const milestones=[...new Set([...people.map(p=>p.at),...edges.map(e=>e[1])])].sort((a,b)=>a-b);function fitTree(){const w=treeWrap.clientWidth;const scale=Math.min(1,w/760);tree.style.transform='scale('+scale+')';treeWrap.style.height=(335*scale)+'px';tree.style.marginLeft=Math.max(0,(w-760*scale)/2)+'px'}window.addEventListener('resize',fitTree);function setPage(v){page=Math.max(1,Math.min(MAX,Number(v)));render()}document.getElementById('prev').onclick=()=>setPage(page-1);document.getElementById('next').onclick=()=>setPage(page+1);slider.oninput=e=>setPage(e.target.value);document.getElementById('jump').onclick=()=>setPage(milestones.find(n=>n>page)||1);document.getElementById('reset').onclick=()=>{selected=null;setPage(1)};document.addEventListener('keydown',e=>{if(e.target===slider)return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});render();fitTree();
</script></body></html>
